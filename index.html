<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="بوابة موظفي اليمامة">
  <title>بوابة موظفي اليمامة</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #102b46, #17645d);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 22px;
      padding: 38px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #e8f3ef;
      color: #17645d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #17354d;
      font-size: 25px;
      margin: 0 0 10px;
    }

    .description {
      text-align: center;
      color: #788795;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #263c4e;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #dce4e9;
      border-radius: 11px;
      padding: 0 15px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
      direction: ltr;
      text-align: right;
    }

    input:focus {
      border-color: #19766a;
      box-shadow: 0 0 0 3px rgba(25,118,106,.1);
    }

    button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 11px;
      background: #17645d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      background: #eef5f3;
      color: #17645d;
    }

    .footer {
      text-align: center;
      color: #9aa6ae;
      font-size: 12px;
      margin-top: 27px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">Y</div>

    <h1>بوابة موظفي اليمامة</h1>

    <p class="description">
      مرحباً بك في بوابة الموظفين.
      أدخل رقمك الوظيفي ورقم جوالك المسجل لدى الإدارة.
    </p>

    <form id="loginForm">
      <label for="employee">الرقم الوظيفي</label>
      <input
        id="employee"
        type="text"
        placeholder="أدخل الرقم الوظيفي"
        required
        autocomplete="off"
      >

      <label for="phone">رقم الجوال</label>
      <input
        id="phone"
        type="tel"
        placeholder="05xxxxxxxx"
        required
        autocomplete="tel"
      >

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      بوابة الموظفين © اليمامة
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://lpnogejpefsprjggeceo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_S6tLSatDIEgbhPvB7uBTTw_oadYhvAa";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const employeeNumber =
        document.getElementById("employee").value.trim();

      const phoneNumber =
        document.getElementById("phone").value.trim();

      message.style.display = "block";
      message.textContent = "جاري التحقق من البيانات...";
      button.disabled = true;

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/employee-auth`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
              employee_number: employeeNumber,
              phone_number: phoneNumber
            })
          }
        );

        const result = await response.json();

        if (response.ok && result.success) {
          message.textContent = "تم التحقق من البيانات بنجاح.";
        } else {
          message.textContent =
            result.message || "تعذر التحقق من البيانات.";
        }

      } catch (error) {
        message.textContent =
          "تعذر الاتصال بالخادم. حاول مرة أخرى.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

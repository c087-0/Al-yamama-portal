<script>
const SUPABASE_URL = "https://lpnogejpefsprjggeceo.supabase.co/rest/v1/";

const SUPABASE_ANON_KEY = "sb_publishable_S6tLSatDIEgbhPvB7uBTTw_oadYhvAa";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const employeeNumber = document.getElementById("employee").value.trim();
  const phoneNumber = document.getElementById("phone").value.trim();
  const message = document.getElementById("message");

  message.style.display = "block";
  message.textContent = "جاري التحقق من البيانات...";

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/employee-auth`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({
        employee_number: employeeNumber,
        phone_number: phoneNumber
      })
    });

    const result = await response.json();

    if (response.ok && result.success) {
      message.textContent = "تم التحقق من البيانات بنجاح.";
    } else {
      message.textContent = result.message || "تعذر التحقق من البيانات.";
    }

  } catch (error) {
    message.textContent = "تعذر الاتصال بالخادم، حاول مرة أخرى.";
  }
});
</script>

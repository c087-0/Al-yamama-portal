<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة موظفي اليمامة</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#102b46,#17645d);padding:25px}
.container{max-width:850px;margin:40px auto;background:white;border-radius:22px;padding:30px;box-shadow:0 15px 50px #0002}
.logo{width:65px;height:65px;margin:0 auto 15px;background:#e8f3ef;color:#17645d;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}
h1{text-align:center;color:#17354d;margin:10px 0}
.description{text-align:center;color:#788795;line-height:1.8;margin-bottom:30px}
label{display:block;font-weight:bold;color:#263c4e;margin-bottom:9px}
input,textarea,select{width:100%;padding:15px;border:1px solid #dce4e9;border-radius:10px;font-size:15px;margin-bottom:20px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#17645d}
button{border:0;border-radius:10px;padding:15px 20px;background:#17645d;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.primary{width:100%}
#message{display:none;margin-top:15px;padding:13px;background:#eef5f3;border-radius:10px;text-align:center;color:#17645d}
.hidden{display:none!important}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:20px;margin-bottom:25px}
.header h1{text-align:right;font-size:23px}
.logout{background:#f1f3f5;color:#354b5e;padding:10px 15px;font-size:13px}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.service{border:1px solid #e5ecef;border-radius:16px;padding:25px 15px;text-align:center;cursor:pointer;background:#fff;transition:.2s}
.service:hover{border-color:#17645d;transform:translateY(-3px);box-shadow:0 8px 20px #0000}
.service .icon{font-size:35px;margin-bottom:12px}
.service h2{font-size:19px;color:#17354d;margin:8px}
.service p{font-size:13px;color:#82909a;margin:0}
.service:last-child{grid-column:1/-1}
.back{background:#eef3f1;color:#17645d;margin-bottom:20px}
.form-title{color:#17354d}
.footer{text-align:center;color:#9aa6ae;font-size:12px;margin-top:30px}
@media(max-width:550px){body{padding:12px}.container{padding:22px 17px;margin:15px auto}.services{grid-template-columns:1fr}.service:last-child{grid-column:auto}}
</style>
</head>
<body>
<main class="container">

<section id="loginPage">
<div class="logo">Y</div>
<h1>بوابة موظفي اليمامة</h1>
<p class="description">مرحباً بك. أدخل بياناتك المسجلة لدى الإدارة.</p>

<form id="loginForm">
<label for="employee">الرقم الوظيفي</label>
<input id="employee" type="text" placeholder="أدخل الرقم الوظيفي" required>

<label for="phone">رقم الجوال</label>
<input id="phone" type="tel" placeholder="05xxxxxxxx" required>

<button class="primary" id="loginButton" type="submit">تسجيل الدخول</button>
<div id="message" role="status" aria-live="polite"></div>
</form>
</section>

<section id="servicesPage" class="hidden">
<div class="header">
<div>
<h1>بوابة موظفي اليمامة</h1>
<p class="description" style="margin:5px 0">اختر الخدمة التي ترغب في تقديمها</p>
</div>
<button class="logout" id="logoutButton">تسجيل الخروج</button>
</div>

<div id="servicesList" class="services">
<div class="service" data-type="complaint">
<div class="icon">🗣️</div>
<h2>الشكاوى</h2>
<p>تقديم شكوى للإدارة</p>
</div>
<div class="service" data-type="report">
<div class="icon">📢</div>
<h2>البلاغات</h2>
<p>تقديم بلاغ للإدارة</p>
</div>
<div class="service" data-type="request">
<div class="icon">📋</div>
<h2>الطلبات</h2>
<p>تقديم طلب إداري</p>
</div>
</div>

<div id="serviceForm" class="hidden">
<button class="back" id="backButton">← العودة للخدمات</button>
<h2 class="form-title" id="serviceTitle"></h2>
<p class="description">هذه واجهة أولية لتجهيز نموذج الخدمة.</p>
<label for="subject">عنوان الموضوع</label>
<input id="subject" type="text" placeholder="اكتب عنوان الموضوع">
<label for="details">التفاصيل</label>
<textarea id="details" rows="5" placeholder="اكتب تفاصيل الخدمة هنا"></textarea>
<div id="formMessage"></div>
</div>
</section>

<div class="footer">بوابة الموظفين © اليمامة</div>
</main>

<script>
const SUPABASE_URL = "https://lpnogejpefsprjggeceo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_S6tLSatDIEgbhPvB7uBTTw_oadYhvAa";

const loginPage = document.getElementById("loginPage");
const servicesPage = document.getElementById("servicesPage");
const servicesList = document.getElementById("servicesList");
const serviceForm = document.getElementById("serviceForm");
const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener("submit", async function(e){
e.preventDefault();
const employeeNumber = document.getElementById("employee").value.trim();
const phoneNumber = document.getElementById("phone").value.trim();
const button = document.getElementById("loginButton");

message.style.display = "block";
message.textContent = "جاري التحقق...";
button.disabled = true;

try{
const response = await fetch(`${SUPABASE_URL}/functions/v1/employee-auth`,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_ANON_KEY,
"Authorization":`Bearer ${SUPABASE_ANON_KEY}`
},
body:JSON.stringify({
employee_number:employeeNumber,
phone_number:phoneNumber
})
});

const result = await response.json();

if(response.ok && result.success){
loginPage.classList.add("hidden");
servicesPage.classList.remove("hidden");
}else{
message.textContent = result.message || "تعذر التحقق من البيانات.";
}
}catch(error){
message.textContent = "تعذر الاتصال بالخادم.";
}finally{
button.disabled = false;
}
});

document.querySelectorAll(".service").forEach(card=>{
card.addEventListener("click",()=>{
const type = card.dataset.type;
const titles = {
complaint:"تقديم شكوى",
report:"تقديم بلاغ",
request:"تقديم طلب"
};
document.getElementById("serviceTitle").textContent = titles[type];
servicesList.classList.add("hidden");
serviceForm.classList.remove("hidden");
});
});

document.getElementById("backButton").addEventListener("click",()=>{
serviceForm.classList.add("hidden");
servicesList.classList.remove("hidden");
});

document.getElementById("logoutButton").addEventListener("click",()=>{
servicesPage.classList.add("hidden");
loginPage.classList.remove("hidden");
servicesList.classList.remove("hidden");
serviceForm.classList.add("hidden");
document.getElementById("loginForm").reset();
message.style.display = "none";
});
</script>
</body>
</html>
